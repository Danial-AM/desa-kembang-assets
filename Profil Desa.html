<style>
/* Base Styles */
.profil-wrapper {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem 1rem;
  font-family: var(--font-body);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  margin: 0;
  line-height: 1.3;
}

/* Prevent margin collapse with page-header children */
.page-header .page-label,
.page-header .page-title,
.page-header .page-desc {
  margin: 0;
}
.page-header {
  margin: 0;
}

p {
  margin: 0 0 1rem;
  line-height: 1.6;
}

.section-heading {
  font-size: 2.5rem;
  color: var(--text-primary);
  margin-bottom: 1rem;
  font-weight: 800;
  line-height: 1.2;
  font-family: var(--font-heading);
}

.text-emerald {
  color: var(--accent-green);
}

.text-gold {
  color: var(--accent-gold);
}

.text-muted {
  color: var(--text-muted, #7a828e);
}

.text-secondary {
  color: var(--text-secondary);
}

/* Skeleton Loading */
.skeleton {
  background: linear-gradient(90deg, var(--bg-tertiary) 25%, #2d333b 50%, var(--bg-tertiary) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite linear;
  border-radius: var(--radius-sm, 8px);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.skeleton-text {
  height: 1rem;
  width: 100%;
  margin-bottom: 0.5rem;
}
.skeleton-text.short {
  width: 60%;
}
.skeleton-title {
  height: 1.5rem;
  width: 40%;
  margin-bottom: 1rem;
}
.skeleton-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
}
.skeleton-card {
  height: 120px;
  border-radius: var(--radius-md, 12px);
}

/* Sejarah Desa */
.sejarah-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg, 16px);
  padding: 2rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  align-items: center;
}
.sejarah-content h2 {
  font-size: 2rem;
  margin-bottom: 1.5rem;
  color: var(--accent-green);
}
.sejarah-img-wrapper {
  position: relative;
  border-radius: var(--radius-md, 12px);
  overflow: hidden;
  box-shadow: var(--shadow-md, 0 4px 20px rgba(0,0,0,0.4));
}
.sejarah-img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  aspect-ratio: 4/3;
}

/* Data Demografi */
.demografi-section .source-text {
  font-size: 0.875rem;
  color: var(--text-muted, #7a828e);
  margin-top: 1rem;
  text-align: right;
  font-style: italic;
}
.bento-grid-6 {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 1rem;
}
.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md, 12px);
  padding: 1.5rem 1rem;
  text-align: center;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md, 0 4px 20px rgba(0,0,0,0.4));
  border-color: var(--accent-gold);
}
.stat-value {
  font-family: var(--font-heading);
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--accent-gold);
  margin-bottom: 0.5rem;
}
.stat-label {
  font-size: 0.875rem;
  color: var(--text-secondary);
}

/* Potensi Desa */
.bento-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}
.potensi-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md, 12px);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  transition: transform 0.2s ease;
}
.potensi-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent-green);
}
.potensi-icon {
  font-size: 2rem;
}
.potensi-title {
  color: var(--accent-green);
  font-size: 1.25rem;
  font-weight: 600;
}
.potensi-desc {
  color: var(--text-secondary);
  font-size: 0.9375rem;
  margin: 0;
}

/* Visi & Misi */
.visimisi-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent-green);
  border-radius: var(--radius-lg, 16px);
  padding: 2rem;
}
.visimisi-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
}
.visimisi-header svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: var(--accent-green);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.visimisi-header h2 {
  font-size: 1.5rem;
}
#visi-text {
  font-size: 1.125rem;
  font-style: italic;
  color: var(--text-primary);
  margin-bottom: 2rem;
  line-height: 1.7;
}
.visimisi-divider {
  height: 1px;
  background-color: var(--border);
  margin: 2rem 0;
}
#misi-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.misi-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}
.misi-number {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  min-width: 28px;
  background: var(--accent-gold-dim, rgba(245,158,11,0.15));
  color: var(--accent-gold);
  border-radius: 50%;
  font-weight: 700;
  font-size: 0.875rem;
  font-family: var(--font-heading);
}
.misi-text {
  color: var(--text-secondary);
  line-height: 1.6;
  padding-top: 0.125rem;
}

/* Struktur Pemerintahan */
.struktur-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 1.5rem;
}
.struktur-card,
.person-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md, 12px);
  padding: 1.25rem 0.75rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.struktur-card:hover,
.person-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent-green);
  box-shadow: var(--shadow-md, 0 4px 12px rgba(0,0,0,0.4));
}
.struktur-photo,
.person-photo {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--accent-green);
  padding: 2px;
  background: var(--bg-tertiary);
}
.struktur-name,
.person-name {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
}
.struktur-role,
.person-role {
  font-size: 0.75rem;
  color: var(--text-muted, #7a828e);
}

/* Responsive Breakpoints */
@media (max-width: 992px) {
  .bento-grid-6, .struktur-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 768px) {
  .sejarah-card {
    grid-template-columns: 1fr;
    padding: 1.5rem;
  }
  .bento-grid-3 {
    grid-template-columns: 1fr;
  }
  .profil-wrapper {
    gap: 2rem;
  }
  .visimisi-card {
    padding: 1.5rem;
  }
}

@media (max-width: 480px) {
  .bento-grid-6, .struktur-grid {
    grid-template-columns: 1fr;
  }
  .section-heading {
    font-size: 1.75rem;
  }
  .sejarah-content h2 {
    font-size: 1.5rem;
  }
  .sejarah-card, .visimisi-card {
    padding: 1rem;
  }
  .visimisi-header h2 {
    font-size: 1.25rem;
  }
  #visi-text {
    font-size: 1rem;
  }
  .profil-wrapper {
    gap: 1.5rem;
  }
}
</style>
