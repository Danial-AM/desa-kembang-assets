<style>
  .produk-wrapper { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; display: flex; flex-direction: column; gap: 2rem; }
  /* Page header inherits theme default (.page-header / .page-label / .page-title / .page-desc) */

  .product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem;
    margin-bottom: 3rem;
  }

  .product-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg, 16px);
    overflow: hidden;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .product-card:hover {
    border-color: var(--accent-green);
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    transform: translateY(-4px);
  }

  .product-image-container {
    aspect-ratio: 1 / 1;
    overflow: hidden;
    position: relative;
    background: var(--bg-tertiary);
  }
  .product-card:hover .product-image {
    transform: scale(1.05);
  }
  .product-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .product-content {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .product-seller {
    font-size: 0.75rem;
    color: var(--text-muted, #7a828e);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .product-name {
    font-family: var(--font-heading);
    color: var(--text-primary);
    font-size: 1.125rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    line-height: 1.4;
  }

  .product-price {
    font-family: var(--font-heading);
    color: var(--accent-gold);
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 1.25rem;
    margin-top: auto;
  }

  .btn-buy {
    width: 100%;
    padding: 0.75rem;
    background: var(--accent-green);
    color: #ffffff;
    border: none;
    border-radius: var(--radius-sm, 8px);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.875rem;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }
  .btn-buy:hover {
    background: var(--accent-green-hover);
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
  }

  /* Skeleton loaders */
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--bg-tertiary) 25%, #2d333b 50%, var(--bg-tertiary) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius-sm, 8px);
  }
  .skeleton-img {
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
  .skeleton-text {
    height: 1rem;
    margin-bottom: 0.5rem;
  }
  .skeleton-text.short {
    width: 40%;
  }
  .skeleton-text.title {
    height: 1.25rem;
    width: 80%;
  }
  .skeleton-price {
    height: 1.5rem;
    width: 50%;
    margin-bottom: 1.25rem;
    margin-top: auto;
  }
  .skeleton-btn {
    height: 2.5rem;
    width: 100%;
  }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 2rem;
  }
  .page-btn {
    width: 2.5rem;
    height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm, 8px);
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .page-btn:hover {
    border-color: var(--accent-green);
    color: var(--accent-green);
  }
  .page-btn.active {
    background: var(--accent-green);
    border-color: var(--accent-green);
    color: #ffffff;
  }

  /* Responsive */
  @media (max-width: 1024px) {
    .product-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 640px) {
    .product-grid {
      grid-template-columns: 1fr;
    }
  }
  @media (max-width: 480px) {
    .product-grid {
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .product-name {
      font-size: 1rem;
    }
    .product-price {
      font-size: 1.125rem;
    }
    .product-content {
      padding: 1rem;
    }
    .btn-buy {
      padding: 0.625rem;
      font-size: 0.8125rem;
    }
    .page-btn {
      width: 2rem;
      height: 2rem;
      font-size: 0.875rem;
    }
  }
</style>
