<style>
  /* Base & Variables */
  .kontak-container {
    max-width: 1200px;
    margin: 0 auto;
    font-family: var(--font-body, 'Inter', sans-serif);
    color: var(--text-primary, #e6edf3);
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  /* Page header inherits theme default (.page-header / .page-label / .page-title / .page-desc) */

  /* Bento Grid Layout */
  .bento-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  /* Card Styles */
  .bento-card {
    background: var(--bg-secondary, #161b22);
    border: 1px solid var(--border, #30363d);
    border-radius: var(--radius-lg, 16px);
    overflow: hidden;
  }

  /* Map Placeholder */
  .map-card {
    height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-top: 4px solid var(--accent-green, #10b981);
    background: linear-gradient(to bottom, var(--bg-tertiary, #21262d), var(--bg-secondary, #161b22));
    padding: 2rem;
  }
  .map-icon {
    width: 48px;
    height: 48px;
    color: var(--accent-green, #10b981);
    margin-bottom: 1rem;
    filter: drop-shadow(0 0 8px var(--accent-green-dim, rgba(16,185,129,0.3)));
  }
  .map-title {
    font-family: var(--font-heading, 'Space Grotesk', sans-serif);
    font-size: 1.25rem;
    font-weight: 600;
    color: #ffffff;
    margin: 0 0 0.5rem;
  }
  .map-desc {
    color: var(--text-secondary, #8b949e);
    font-size: 0.875rem;
  }

  /* Info Grid */
  .info-card {
    padding: 1.5rem;
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
  @media (min-width: 640px) {
    .info-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  .info-item {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }
  .info-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md, 12px);
    background: var(--accent-green-dim, rgba(16,185,129,0.15));
    color: var(--accent-green, #10b981);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .info-icon svg {
    width: 20px;
    height: 20px;
  }
  .info-content {
    flex: 1;
    min-width: 0;
  }
  .info-label {
    font-size: 0.875rem;
    color: var(--text-secondary, #8b949e);
    margin-bottom: 0.25rem;
    font-weight: 500;
  }
  .info-value {
    color: var(--text-primary, #e6edf3);
    font-weight: 500;
    line-height: 1.5;
    word-break: break-word;
  }

  /* Skeletons */
  .skeleton {
    background: linear-gradient(90deg, var(--bg-tertiary, #21262d) 25%, #2d333b 50%, var(--bg-tertiary, #21262d) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    color: transparent !important;
    display: inline-block;
  }
  .skeleton-text {
    height: 1.25rem;
    width: 100%;
    margin-bottom: 0.25rem;
  }
  .skeleton-text.short {
    width: 60%;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* WhatsApp Button */
  .wa-button-wrapper {
    margin-top: 1.5rem;
  }
  .wa-button,
  .wa-button:link,
  .wa-button:visited,
  .wa-button:active {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    background: #25D366;
    color: #ffffff !important;
    padding: 1rem;
    border-radius: var(--radius-md, 12px);
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none !important;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
    border: none;
  }
  .wa-button:hover {
    background: #20BA56;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(37, 211, 102, 0.3);
    color: #ffffff !important;
  }
  .wa-button svg {
    width: 24px;
    height: 24px;
  }

  /* Social Media Card */
  .sosmed-card {
    padding: 1.5rem;
  }
  .sosmed-title {
    font-family: var(--font-heading, 'Space Grotesk', sans-serif);
    font-size: 1.25rem;
    font-weight: 600;
    color: #ffffff;
    margin: 0 0 1rem;
  }
  .sosmed-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  @media (min-width: 640px) {
    .sosmed-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
 .sosmed-tile,
  .sosmed-tile:link,
  .sosmed-tile:visited,
  .sosmed-tile:active {
    display: flex;
    align-items: center;
    padding: 1rem;
    border-radius: var(--radius-md, 12px);
    text-decoration: none !important;
    color: #ffffff !important;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .sosmed-tile:hover {
    transform: translateY(-2px);
    opacity: 0.95;
    color: #ffffff !important;
  }
  .sosmed-tile.fb {
    background: #2563eb;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }
  .sosmed-tile.ig {
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    box-shadow: 0 4px 12px rgba(220, 39, 67, 0.2);
  }
  .sosmed-icon {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 1rem;
  }
  .sosmed-icon svg {
    width: 20px;
    height: 20px;
  }
  .sosmed-info {
    flex: 1;
  }
  .sosmed-name {
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 0.125rem;
  }
  .sosmed-username {
    font-size: 0.875rem;
    opacity: 0.9;
  }
  
  .map-responsive {
    width: 100%;
    height: 450px;
  }

  @media (max-width: 480px) {
    .page-title {
        font-size: 1.5rem !important;
    }
    .page-desc {
        font-size: 0.9rem !important;
    }
    .info-card, .sosmed-card, .map-card {
        padding: 1rem;
    }
    .map-responsive {
        height: 350px;
    }
    .info-icon {
        width: 36px;
        height: 36px;
    }
    .info-icon svg {
        width: 16px;
        height: 16px;
    }
    .sosmed-icon {
        width: 32px;
        height: 32px;
        margin-right: 0.75rem;
    }
    .sosmed-icon svg {
        width: 16px;
        height: 16px;
    }
  }
</style>
